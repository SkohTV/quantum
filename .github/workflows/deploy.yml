name: Deploy on VPS


on:
  push:
    tags:
      # v1.2.3
      # v1.2.3-testing
      - v[0-9]+.[0-9]+.[0-9]+*


concurrency:
  group: 'quantum'
  cancel-in-progress: false


jobs:

  publish:

      uses: docker/github-builder/.github/workflows/build.yml@v1

      permissions:
        contents: read
        id-token: write
        packages: write

      with:
        output: image
        push: true
        file: .github/Dockerfile

        platforms: |
          linux/amd64
          linux/arm64

        meta-images: ghcr.io/skohtv/quantum
        meta-tags: |
          latest

      secrets:
        registry-auths: |
          - registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}


  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Add ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect and redeploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          (docker kill quantum || true) &&\
          (docker rm quantum || true) &&\
          docker pull ghcr.io/skohtv/quantum:latest &&\
          docker run --env-file .quantum.env --name quantum --detach ghcr.io/skohtv/quantum:latest"

      - name: Cleanup
        run: rm -rf ~/.ssh

