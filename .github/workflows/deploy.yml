name: Deploy on VPS


on:
  push:
    branches:
      - '*-dev'
    # tags:
    #   - v[0-9]+.[0-9]+.[0-9]+


concurrency:
  group: 'quantum'
  cancel-in-progress: false


jobs:

  publish:
    name: Publish docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: .github/Dockerfile
          tags: ghcr.io/skohtv/quantum:latest 


  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Add ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect and redeploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          (docker kill quantum || true) &&\
          (docker rm quantum || true) &&\
          docker pull ghcr.io/skohtv/quantum:latest &&\
          docker run --env-file .quantum.env --name quantum --detach ghcr.io/skohtv/quantum:latest"

      - name: Cleanup
        run: rm -rf ~/.ssh

